apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: tender
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp }
  template:
    metadata:
      labels: { app: mcp }
    spec:
      containers:
        - name: mcp
          image: tender-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef: { name: tender-config }
            - secretRef:    { name: tender-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: tender
spec:
  selector: { app: mcp }
  ports:
    - port: 9000
      targetPort: 9000