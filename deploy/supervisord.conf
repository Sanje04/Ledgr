# Process supervision for the all-in-one image (see the root Dockerfile).
#
# The application is three processes -- the MCP tool server, the FastAPI backend,
# and nginx -- and a container needs exactly one foreground process, so something
# has to own the other two. supervisord rather than a shell script with `&`:
# a backgrounded child that dies leaves the script running and the container
# "healthy" while the app is broken, whereas supervisord restarts it and says so.
#
# Logs go to the container's stdout/stderr rather than to files inside the
# container, so `az containerapp logs show` sees them. Log rotation is disabled
# for the same reason: the platform collects the stream, and rotating a pipe is
# meaningless.

[supervisord]
nodaemon=true
user=root
# Supervisor's own log would otherwise be a file nobody reads; the child logs are
# what matter and they go to stdout below.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# The MCP tool server. Started first (lowest priority number) so the tools are
# usually discoverable by the time the backend's startup hook runs -- but this is
# an optimisation, not a requirement: mcp_client.discover_tools() fails soft and
# the backend retries discovery on each chat request, so a slow start here costs
# at most one tool-less reply. See backend/specs.md Phase 8.
[program:mcp]
command=python mcp_server.py
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# The FastAPI backend, bound to loopback only. Nothing outside this container
# should reach it directly -- nginx is the only caller -- so binding 127.0.0.1
# means a platform port mapping cannot accidentally expose the API, including
# POST /api/transactions/import, which replaces all transaction data and has no
# authentication.
#
# --forwarded-allow-ips is 127.0.0.1, not *, because the only proxy in front of
# uvicorn here is the nginx in this same container. Trusting * would let a
# client-supplied X-Forwarded-For spoof the address the rate limiter keys on.
[program:backend]
command=uvicorn main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# nginx: serves the built frontend and proxies /api/ to the backend above. The
# only process listening on a port the outside world can reach.
[program:nginx]
command=nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
