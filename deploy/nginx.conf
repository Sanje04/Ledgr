# nginx config for the all-in-one image (see the root Dockerfile).
#
# This is a static config, unlike ui/nginx.conf.template which the split
# multi-container build renders at startup. The difference is not an
# inconsistency: there, the backend is a separate container whose address varies
# by platform and may not resolve when nginx loads, so the upstream has to be a
# runtime variable behind a resolver. Here the backend is a process in this same
# container, so the upstream is always loopback -- no substitution, no resolver,
# nothing to configure.
#
# Keep the proxy timeouts below in sync with agent.py's httpx timeout (170s) and
# ui/nginx.conf.template's matching values. They exist so the backend, not the
# proxy, decides when a slow model call has taken too long.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Azure's ingress terminates TLS and forwards plain HTTP, so this is the only
    # hop that sees the request unencrypted, and it is loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends rather than replaces, so the client IP the platform's ingress
        # recorded survives to uvicorn -- which is what main.py's per-client-IP
        # rate limiter keys on. Dropping this collapses every visitor into one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold Ollama model load (multi-GB) plus real inference can exceed
        # nginx's default 60s, cutting the request before the backend itself
        # would give up.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA fallback: the frontend has no router, but a deep link or a refresh must
    # still return index.html rather than a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
